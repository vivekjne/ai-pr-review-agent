# =============================================================================
# AI PR Review — GitHub Actions Workflow
# =============================================================================
# Runs automatically on pull request events, OR manually via workflow_dispatch
# to review an existing PR.
#
# Setup:
#   Add OPENCODE_API_KEY as a repository secret:
#     Settings → Secrets and variables → Actions → New repository secret
#
# Variables:
#   GITHUB_TOKEN       → auto-provided by Actions (has issues:write)
#   OPENCODE_API_KEY   → must be added as a secret (required)
#   OPENCODE_BASE_URL  → defaults below; override as a secret if needed
#   OPENCODE_MODEL     → defaults below; override as a secret if needed
# =============================================================================
name: AI PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (for existing PRs)"
        required: false
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    # Skip draft PRs (only applies to pull_request events)
    if: >
      github.event_name != 'pull_request'
      || github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Resolve PR number ──────────────────────────────────────────────
      # When triggered manually (workflow_dispatch), use the user-provided PR
      # number. When triggered by a PR event, use the event's PR number.
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.pr_number }}" ]; then
            echo "number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run AI PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL || 'https://opencode.ai/zen/go/v1' }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL || 'deepseek-v4-flash' }}
        run: |
          python -m app.cli.review_pr \
            --owner "${GITHUB_REPOSITORY%/*}" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --pull-number "${{ steps.pr.outputs.number }}" \
            --post-comment \
            --fail-on-high-risk \
            --fail-on-request-changes
