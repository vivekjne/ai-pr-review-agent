# =============================================================================
# AI PR Review — Composite GitHub Action
# =============================================================================
# Use from any repo:
#
#   steps:
#     - uses: vivekjne/ai-pr-review-agent@main
#       with:
#         opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
#         github-token: ${{ secrets.GITHUB_TOKEN }}
#
# github-token is required — GitHub's auto-generated token must be passed
# explicitly because composite actions don't inherit env vars automatically.
# =============================================================================
name: "AI PR Review"
description: "Automatically reviews pull requests using AI"
author: "AI PR Review Agent"

inputs:
  opencode-api-key:
    description: "OpenCode Go API key"
    required: true
  github-token:
    description: "GitHub token (pass secrets.GITHUB_TOKEN from caller workflow)"
    required: true
  opencode-base-url:
    description: "API base URL"
    required: false
    default: "https://opencode.ai/zen/go/v1"
  opencode-model:
    description: "Model name"
    required: false
    default: "deepseek-v4-flash"
  pr-number:
    description: "PR number (for manual dispatch on existing PRs)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - name: Resolve PR number
      id: pr
      shell: bash
      run: |
        if [ -n "${{ inputs.pr-number }}" ]; then
          echo "number=${{ inputs.pr-number }}" >> "$GITHUB_OUTPUT"
        else
          echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Test token permissions
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        echo "Testing token on Issues API..."
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/comments")
        echo "Issues API status: $STATUS"
        if [ "$STATUS" = "403" ]; then
          echo "❌ Token doesn't have issues:write permission for this repo."
          echo "   Make sure the PAT has 'repo' scope or use a classic PAT."
        elif [ "$STATUS" = "401" ]; then
          echo "❌ Token is invalid or expired."
        elif [ "$STATUS" = "200" ]; then
          echo "✅ Token has read access to issues."
        fi

    - name: Test OpenCode API key
      shell: bash
      env:
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
      run: |
        echo "Testing OpenCode API key..."
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer $OPENCODE_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"hello"}]}' \
          "https://opencode.ai/zen/go/v1/chat/completions")
        echo "OpenCode API status: $STATUS"

    - name: Run AI PR Review
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        OPENCODE_BASE_URL: ${{ inputs.opencode-base-url }}
        OPENCODE_MODEL: ${{ inputs.opencode-model }}
      run: |
        python ${{ github.action_path }}/app/cli/review_pr.py \
          --owner "${GITHUB_REPOSITORY%/*}" \
          --repo "${GITHUB_REPOSITORY#*/}" \
          --pull-number "${{ steps.pr.outputs.number }}" \
          --post-comment \
          --fail-on-high-risk \
          --fail-on-request-changes
      shell: bash
